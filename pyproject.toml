[project]
name = "invoiceflow"
version = "0.1.0"
description = "Claude-powered invoice extraction, validation and posting to Xero / QuickBooks Online"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
invoiceflow = "invoiceflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoiceflow", "invoiceflow.accounting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
